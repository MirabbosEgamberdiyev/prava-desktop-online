name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run
      - run: npm run audit:i18n

  rust:
    # Windows: Tauri'ning Linux tizim bog'liqliklarisiz (webkit2gtk) test qilish uchun.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # tauri::generate_context! frontendDist papkasi mavjud bo'lishini talab qiladi.
      - run: New-Item -ItemType Directory -Force ../dist | Out-Null
        shell: pwsh
      - run: cargo test --locked
