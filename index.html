<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prava Online - Haydovchilik imtihoniga tayyorgarlik" />
    <title>Prava Online</title>

    <!-- ⚡ Performance: backend bilan ulanishni oldindan tayyorlash (TLS handshake) -->

    <link rel="preconnect" href="http://localhost:8080" crossorigin>

    <!-- Logo va default rasmni kritik resurslar sifatida oldindan yuklab olish -->
    <link rel="preload" href="/logo.png" as="image" type="image/png">
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="/question-default.svg" as="image" type="image/svg+xml">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
