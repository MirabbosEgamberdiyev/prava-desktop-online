<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Prava Online — Haydovchilik imtihoniga tayyorlanish">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#64748b"/>
      <stop offset="55%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="60%" r="50%">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ── Sky ── -->
  <rect width="600" height="400" fill="url(#sky)" rx="16"/>

  <!-- Sun glow on horizon -->
  <ellipse cx="300" cy="220" rx="240" ry="110" fill="url(#sun)"/>
  <circle cx="300" cy="220" r="48" fill="#fef3c7" opacity="0.9"/>

  <!-- Distant mountains silhouette -->
  <path d="M 0 230 L 70 200 L 130 215 L 200 190 L 260 210 L 330 195 L 400 215 L 470 200 L 540 220 L 600 205 L 600 240 L 0 240 Z"
        fill="#0f172a" opacity="0.35"/>

  <!-- Horizon band -->
  <rect x="0" y="225" width="600" height="20" fill="url(#hor)"/>

  <!-- ── Road ── -->
  <path d="M 50 400 L 240 240 L 360 240 L 550 400 Z" fill="url(#road)"/>

  <!-- Center yellow stripes -->
  <g fill="#fbbf24">
    <polygon points="296,250 304,250 307,272 293,272"/>
    <polygon points="291,285 309,285 313,313 287,313"/>
    <polygon points="284,326 316,326 322,360 278,360"/>
  </g>
  <!-- Edge lines -->
  <line x1="240" y1="240" x2="50"  y2="400" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <line x1="360" y1="240" x2="550" y2="400" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Side dashes -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.55">
    <line x1="225" y1="252" x2="218" y2="262"/>
    <line x1="200" y1="278" x2="190" y2="294"/>
    <line x1="170" y1="312" x2="156" y2="333"/>
    <line x1="375" y1="252" x2="382" y2="262"/>
    <line x1="400" y1="278" x2="410" y2="294"/>
    <line x1="430" y1="312" x2="444" y2="333"/>
  </g>

  <!-- ── Traffic sign on left: STOP-style red octagon ── -->
  <g transform="translate(90,205)">
    <rect x="-2.5" y="0" width="5" height="48" fill="#475569"/>
    <polygon points="-22,-22 22,-22 32,0 22,22 -22,22 -32,0"
             fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="11" font-weight="900" fill="#ffffff" letter-spacing="0.5">STOP</text>
  </g>

  <!-- ── Traffic light on right ── -->
  <g transform="translate(490,180)">
    <rect x="-2" y="0" width="4" height="60" fill="#475569"/>
    <rect x="-12" y="-46" width="24" height="58" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <circle cx="0" cy="-37" r="6" fill="#fca5a5" opacity="0.45"/>
    <circle cx="0" cy="-20" r="6" fill="#fde047" opacity="0.45"/>
    <circle cx="0" cy="-3"  r="6" fill="#4ade80"/>
    <circle cx="0" cy="-3"  r="9" fill="#4ade80" opacity="0.35" filter="url(#soft)"/>
  </g>

  <!-- ── Car (centered, approaching) ── -->
  <g transform="translate(300,330)">
    <!-- shadow under car -->
    <ellipse cx="0" cy="32" rx="76" ry="6" fill="#000000" opacity="0.30"/>

    <!-- body -->
    <path d="M -68 8 L -56 -18 Q -42 -28 -20 -30 L 20 -30 Q 42 -28 56 -18 L 68 8 Q 68 22 56 22 L -56 22 Q -68 22 -68 8 Z"
          fill="url(#carBody)" stroke="#1e293b" stroke-width="1.5"/>
    <!-- windshield -->
    <path d="M -42 -10 Q -32 -24 -18 -25 L 18 -25 Q 32 -24 42 -10 L 32 -8 L -32 -8 Z"
          fill="url(#windshield)" opacity="0.85"/>
    <!-- side windows split -->
    <line x1="0" y1="-26" x2="0" y2="-8" stroke="#1e293b" stroke-width="1.2"/>
    <!-- door line -->
    <line x1="0" y1="-8" x2="0" y2="14" stroke="#1e293b" stroke-width="0.8" opacity="0.5"/>
    <!-- headlights -->
    <ellipse cx="-54" cy="5"  rx="6" ry="3.5" fill="#fef9c3"/>
    <ellipse cx="54"  cy="5"  rx="6" ry="3.5" fill="#fef9c3"/>
    <!-- bumper -->
    <rect x="-66" y="14" width="132" height="3" fill="#0f172a" rx="1.5"/>
    <!-- wheels -->
    <circle cx="-44" cy="22" r="11" fill="#0f172a"/>
    <circle cx="-44" cy="22" r="5"  fill="#475569"/>
    <circle cx="44"  cy="22" r="11" fill="#0f172a"/>
    <circle cx="44"  cy="22" r="5"  fill="#475569"/>
    <!-- license plate -->
    <rect x="-14" y="9" width="28" height="9" rx="1.5" fill="#fef3c7" stroke="#1e293b" stroke-width="0.6"/>
    <text x="0" y="16" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="6" font-weight="900" fill="#0f172a">PRAVA</text>
  </g>

  <!-- ── Brand label ── -->
  <g>
    <text x="300" y="58" text-anchor="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="26" font-weight="900" fill="#ffffff" letter-spacing="4">PRAVA ONLINE</text>
    <text x="300" y="80" text-anchor="middle"
          font-family="'Segoe UI', system-ui, sans-serif"
          font-size="11" font-weight="600" fill="#bfdbfe" letter-spacing="2.5">HAYDOVCHILIK IMTIHONIGA TAYYORLANISH</text>
    <!-- Decorative underline -->
    <line x1="220" y1="92" x2="380" y2="92" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <circle cx="300" cy="92" r="3" fill="#fbbf24"/>
  </g>
</svg>
