[package]
name = "prava-desktop-online"
version = "1.0.0"
description = "Prava - Online versiyasi"
authors = ["Prava"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
# P1-D2: DevTools release build'da o'chirilgan. Debug build'da Tauri DevTools'ni
# avtomatik yoqadi; release'da kerak bo'lsa: cargo build --release --features devtools
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
sysinfo = "0.33"
mac_address = "1.1"
ed25519-dalek = "2"
anyhow = "1.0"
